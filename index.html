<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>ROI vs Plate ROI</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="min-h-screen bg-gray-100 p-8">
<div class="max-w-5xl mx-auto bg-white p-6 rounded shadow">
  <h1 class="text-xl font-bold mb-4">Comparar ROI x Plate ROI</h1>

  <input id="imageInput" type="file" accept="image/*" class="mb-4"/>

  <div class="grid grid-cols-2 gap-4">
    <textarea id="roiInput" class="border p-2 font-mono text-sm h-40"
      placeholder="Faixa ROI JSON"></textarea>

    <textarea id="plateInput" class="border p-2 font-mono text-sm h-40"
      placeholder="Plate ROI JSON"></textarea>
  </div>

  <canvas id="canvas" class="mt-6 border max-w-full h-auto"></canvas>
</div>

<img id="hiddenImage" hidden />

<script>
const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
const img = document.getElementById('hiddenImage');

document.getElementById('imageInput').onchange = e => {
  const r = new FileReader();
  r.onload = ev => {
    img.src = ev.target.result;
    img.onload = draw;
  };
  r.readAsDataURL(e.target.files[0]);
};

document.getElementById('roiInput').oninput = draw;
document.getElementById('plateInput').oninput = draw;

function draw() {
  if (!img.src) return;

  canvas.width = img.naturalWidth;
  canvas.height = img.naturalHeight;
  ctx.drawImage(img, 0, 0);

  drawRoi();
  drawPlate();
}

function drawRoi() {
  try {
    const r = JSON.parse(roiInput.value);
    ctx.strokeStyle = 'lime';
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(r.point1.x, r.point1.y);
    ctx.lineTo(r.point2.x, r.point2.y);
    ctx.lineTo(r.point3.x, r.point3.y);
    ctx.lineTo(r.point4.x, r.point4.y);
    ctx.closePath();
    ctx.stroke();
  } catch {}
}

function drawPlate() {
  try {
    const p = JSON.parse(plateInput.value);
    const x = p.x1;
    const y = p.y1;
    const w = p.x2 - p.x1;
    const h = p.y3 - p.y1;

    ctx.strokeStyle = 'red';
    ctx.lineWidth = 3;
    ctx.strokeRect(x, y, w, h);

    ctx.fillStyle = 'red';
    ctx.fillText(`conf=${p.confidence}`, x, y - 5);
  } catch {}
}
</script>
</body>
</html>
